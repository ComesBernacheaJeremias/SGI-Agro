# Controles automáticos antes de cada commit.
# Instalación (una vez, con el repo git creado):  pip install pre-commit && pre-commit install
# Correr a mano sobre todo el repo:               pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Backend: formato + lint (usa la config de backend/pyproject.toml; misma versión que uv.lock)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Secretos (claves, contraseñas, tokens) que no deben subirse
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Frontend: formato + lint (usa frontend/node_modules)
  - repo: local
    hooks:
      - id: frontend-prettier
        name: prettier (frontend)
        language: system
        entry: bash -c 'cd frontend && npx prettier --write --ignore-unknown "${@#frontend/}"' --
        files: ^frontend/
        exclude: ^frontend/src/api/schema\.d\.ts$
      - id: frontend-eslint
        name: eslint (frontend)
        language: system
        entry: bash -c 'cd frontend && npx eslint --fix "${@#frontend/}"' --
        files: ^frontend/.*\.(ts|tsx)$
        exclude: ^frontend/src/api/schema\.d\.ts$
