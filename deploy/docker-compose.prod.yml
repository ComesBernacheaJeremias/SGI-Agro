# Producción (DigitalOcean). Uso en el servidor, desde la carpeta deploy/:
#   ./deploy.sh
# Guía completa: docs/05-Desarrollo/Entorno-local-y-deploy.md
#
# Mínimo privilegio: la base tiene un administrador (solo lo usan la inicialización y el
# backup/restauración) y un usuario de la aplicación, dueño de su base pero sin permisos de
# superusuario. La API recibe solo lo que necesita (no la clave del administrador).
name: sgi-agro-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      # Para crear el usuario y la base de la aplicación la primera vez (postgres-init/)
      APP_DB_USER: ${POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_NAME: ${POSTGRES_DB}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin puertos publicados: solo la API y el backup llegan a la base

  api:
    build: ../backend
    restart: unless-stopped
    # Variables explícitas (no todo el .env): la API no conoce la clave del administrador
    environment:
      ENVIRONMENT: production
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-}
    # Migraciones pendientes y arranque sin recarga, con 2 procesos
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
             --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    # Caddy: HTTPS automático, sirve la aplicación compilada y pasa /api a la API
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  backup:
    # pg_dump diario comprimido; copia a DigitalOcean Spaces si está configurado
    build: ./backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${DB_ADMIN_USER}
      PGPASSWORD: ${DB_ADMIN_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      APP_DB_USER: ${POSTGRES_USER}
      SPACES_KEY: ${SPACES_KEY:-}
      SPACES_SECRET: ${SPACES_SECRET:-}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_REGION: ${SPACES_REGION:-nyc3}
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  caddy_data:
  caddy_config:
  backups:
