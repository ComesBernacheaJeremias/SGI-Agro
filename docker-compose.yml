# Entorno de desarrollo local. Uso: docker compose up -d
name: sgi-agro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      # En Windows los cambios en carpetas montadas no siempre se detectan sin polling
      WATCHFILES_FORCE_POLLING: "true"
    # Aplica migraciones pendientes y arranca con recarga automática
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      # node_modules propio del contenedor (binarios de Linux); se renueva con `docker compose up -d -V web`
      - /app/node_modules
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  db_data:
